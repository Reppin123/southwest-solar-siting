<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Document</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<style>
  body { background: var(--bg); overflow-y: auto; }
  .doc { max-width: 900px; margin: 0 auto; padding: 24px 32px 60px; background: var(--surface); min-height: 100%; border-left: 1px solid var(--line); border-right: 1px solid var(--line); font-size: 14px; line-height: 1.6; }
  .doc h1 { font-size: 22px; } .doc h2 { font-size: 18px; margin-top: 28px; } .doc h3 { font-size: 15px; }
  .doc table { border-collapse: collapse; margin: 10px 0; font-size: 12.5px; display: block; overflow-x: auto; }
  .doc th, .doc td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
  .doc th { background: #f8fafc; }
  .doc code { background: #f1f5f9; padding: 1px 4px; border-radius: 3px; font-size: 12.5px; }
  .doc pre { background: #f1f5f9; padding: 10px; overflow-x: auto; }
  .doc blockquote { border-left: 3px solid var(--line-strong); margin: 8px 0; padding: 2px 12px; color: var(--ink-2); }
  .bar { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line); padding: 8px 16px; display: flex; gap: 12px; align-items: center; }
</style>
</head>
<body>
<div class="bar"><a href="index.html">Back to dashboard</a><span class="muted" id="path"></span><span style="flex:1"></span><a id="raw" href="#">Raw file</a></div>
<article class="doc" id="doc">Loading</article>
<script>
"use strict";
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function inline(s) {
  const codes = [];
  s = esc(s).replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`)
       .replace(/(^|[\s(])(https?:\/\/[^\s)<]+)/g, (m, p, u) => `${p}<a href="${u}" target="_blank" rel="noopener">${u}</a>`)
       .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|\W)\*([^*\s][^*]*)\*(?=\W|$)/g, "$1<em>$2</em>");
  return s.replace(/\u0000(\d+)\u0000/g, (m, k) => `<code>${codes[+k]}</code>`);
}
function md(src) {
  const L = src.replace(/\r/g, "").split("\n"), out = [];
  let i = 0;
  while (i < L.length) {
    const l = L[i];
    if (/^```/.test(l)) { const b = []; i++; while (i < L.length && !/^```/.test(L[i])) b.push(esc(L[i++])); i++; out.push(`<pre><code>${b.join("\n")}</code></pre>`); continue; }
    let m = l.match(/^(#{1,6})\s+(.*)/); if (m) { out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { out.push("<hr>"); i++; continue; }
    if (/^\s*\|/.test(l) && i + 1 < L.length && /^\s*\|?\s*:?-{2,}/.test(L[i + 1])) {
      const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim()));
      let h = `<table><tr>${cells(l).map((c) => `<th>${c}</th>`).join("")}</tr>`; i += 2;
      while (i < L.length && /^\s*\|/.test(L[i])) h += `<tr>${cells(L[i++]).map((c) => `<td>${c}</td>`).join("")}</tr>`;
      out.push(h + "</table>"); continue;
    }
    if (/^\s*([-*+]|\d+\.)\s+/.test(l)) {
      const ordered = /^\s*\d+\./.test(l); const items = [];
      while (i < L.length && (/^\s*([-*+]|\d+\.)\s+/.test(L[i]) || (/^\s{2,}\S/.test(L[i]) && items.length))) {
        if (/^\s*([-*+]|\d+\.)\s+/.test(L[i])) items.push(L[i].replace(/^\s*([-*+]|\d+\.)\s+/, "")); else items[items.length - 1] += " " + L[i].trim();
        i++;
      }
      out.push(`<${ordered ? "ol" : "ul"}>${items.map((t) => `<li>${inline(t)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`); continue;
    }
    if (/^>\s?/.test(l)) { const b = []; while (i < L.length && /^>\s?/.test(L[i])) b.push(L[i++].replace(/^>\s?/, "")); out.push(`<blockquote>${inline(b.join(" "))}</blockquote>`); continue; }
    if (!l.trim()) { i++; continue; }
    const p = []; while (i < L.length && L[i].trim() && !/^(#{1,6}\s|```|\s*\||\s*([-*+]|\d+\.)\s|>)/.test(L[i])) p.push(L[i++]);
    if (!p.length) p.push(L[i++]);
    out.push(`<p>${inline(p.join(" "))}</p>`);
  }
  return out.join("\n");
}
const f = new URLSearchParams(location.search).get("f") || "";
document.getElementById("path").textContent = f.replace(/^\.\.\//, "");
document.getElementById("raw").href = f;
if (!/\.md$/i.test(f) || /^[a-z]+:/i.test(f)) {
  document.getElementById("doc").textContent = "Only local markdown files can be shown here.";
} else {
  fetch(f).then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); }).then((t) => {
    document.getElementById("doc").innerHTML = md(t);
    const h = document.querySelector(".doc h1"); if (h) document.title = h.textContent;
  }).catch((e) => { document.getElementById("doc").textContent = `Could not load ${f} (${e.message}). Start the app with uv run --script app/serve.py.`; });
}
</script>
</body>
</html>
